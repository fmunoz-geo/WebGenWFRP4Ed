name: Check Blogger HTML against source

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['*.html', 'blogger-map.json', 'scripts/**', '.github/workflows/check-blogger.yml']
  pull_request:
    paths: ['*.html', 'blogger-map.json', 'scripts/**', '.github/workflows/check-blogger.yml']

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test comparison
        run: python -m unittest discover -s scripts -p 'test_blogger_check.py'
      - name: Compare all mapped Blogger posts
        run: python scripts/blogger_check.py
      - name: Save comparison reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blogger-html-comparison
          path: blogger-check-results/
          if-no-files-found: ignore
